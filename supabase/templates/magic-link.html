<!--
  Supabase email template: Authentication -> Emails -> "Magic Link".
  Subject: Your Crowned by Nat sign-in code

  Sent every time the studio owner signs in to the photo manager at
  /admin/login/ (after the very first time, which uses confirmation.html).

  The 6-digit code is the part that matters. The link only works in the same
  browser that asked for it, and a phone usually opens email links in a
  different one, so the sign-in page always offers the code as well.
-->
<div style="max-width:480px;margin:0 auto;padding:32px 24px;font-family:Georgia,'Times New Roman',serif;color:#3d0f22;background:#fdf8fa;">
  <p style="margin:0 0 24px;font-size:12px;letter-spacing:0.3em;text-transform:uppercase;color:#b01050;font-family:Helvetica,Arial,sans-serif;">Crowned by Nat</p>
  <h1 style="margin:0 0 16px;font-size:26px;font-weight:normal;">Your sign-in code</h1>
  <p style="margin:0 0 20px;font-size:15px;line-height:1.6;font-family:Helvetica,Arial,sans-serif;color:#8a5a6e;">Type this code on the sign-in page:</p>
  <p style="margin:0 0 28px;font-size:34px;letter-spacing:0.25em;font-family:Helvetica,Arial,sans-serif;font-weight:bold;color:#3d0f22;">{{ .Token }}</p>
  <p style="margin:0 0 12px;font-size:15px;line-height:1.6;font-family:Helvetica,Arial,sans-serif;color:#8a5a6e;">Or, on the same phone or computer you asked from:</p>
  <p style="margin:0 0 28px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;border-radius:999px;background:#b01050;color:#fff7fa;text-decoration:none;font-family:Helvetica,Arial,sans-serif;font-size:14px;">Sign in</a></p>
  <p style="margin:0;font-size:13px;line-height:1.6;font-family:Helvetica,Arial,sans-serif;color:#8a5a6e;">The code and the link work once and expire after an hour. If you did not ask to sign in, ignore this email; nothing changes without the code.</p>
</div>
