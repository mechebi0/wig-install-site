<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="ml-title">
  <title id="ml-title">Temporary brand placeholder</title>
  <!--
    TEMPORARY BRAND PLACEHOLDER.

    This is NOT the client's logo. It is a neutral serif lockup standing in for
    real branding so the carousel's first slide and the nav have something
    considered to show. Replace this single file with the client's supplied
    logo (keep the filename, or point STUDIO.logo in lib/content.ts at the new
    path) and every place it renders updates at once.

    Deliberately restrained: a hairline rule, a monogram, a wordmark. No
    invented iconography that could be mistaken for a real identity.
  -->
  <g fill="none" stroke="#b01050" stroke-width="1.25" opacity="0.55">
    <line x1="126" y1="96" x2="274" y2="96" />
    <line x1="126" y1="212" x2="274" y2="212" />
  </g>

  <text x="200" y="170"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Playfair Display', serif"
        font-size="88"
        letter-spacing="6"
        fill="#3d0f22">ML</text>

  <text x="200" y="248"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="15"
        letter-spacing="7.5"
        fill="#8a5a6e">MAISON LAC&#201;</text>
</svg>
