<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="320" height="150" role="img" aria-labelledby="cbn-title">
  <title id="cbn-title">Crown by Nat</title>
  <!--
    TEMPORARY BRAND LOCKUP for Crown by Nat.

    A restrained mark drawn to stand in until Nat supplies real branding. It is
    NOT a supplied logo. Replace this single file (keep the filename, or point
    STUDIO.logo in lib/content.ts at the new path) and every place it renders
    updates at once.

    Drawn for the size it is actually used at. It renders about 210px wide in
    the footer, which is a 0.66 scale, so the stroke is 4 units (about 2.6px on
    screen) and there is a solid band under the points: a hairline crown at this
    size reads as a zigzag rather than a crown, and a caption line under the
    wordmark would land near 7px and simply be illegible.

    Set in a system serif, since an SVG used as an <img> cannot pull a web font
    and the mark has to look the same whether or not Playfair has loaded.
  -->
  <g fill="none" stroke="#b01050" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M118 66 L129 30 L145 50 L160 20 L175 50 L191 30 L202 66 Z" />
  </g>

  <g fill="#b01050">
    <circle cx="129" cy="30" r="4.5" />
    <circle cx="160" cy="20" r="5.2" />
    <circle cx="191" cy="30" r="4.5" />
    <rect x="118" y="72" width="84" height="7" rx="3.5" />
  </g>

  <text x="160" y="128" text-anchor="middle"
        font-family="Georgia, &apos;Times New Roman&apos;, serif"
        font-size="44" fill="#3d0f22">Crown <tspan font-style="italic" fill="#8a5a6e">by</tspan> Nat</text>
</svg>
